openapi: 3.0.3
info:
  title: B2B Lead Capture Serverless Contract - Matices
  version: 1.0.0
  description: Formal definition of the outgoing payload from the Astro static frontend to the external serverless handler (web3forms).
servers:
  - url: https://api.web3forms.com/submit
    description: Unified serverless form endpoint (web3forms) used by the static Astro site.
paths:
  /:
    post:
      summary: Structured Corporate Qualification Form Submission
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/B2BLeadPayload'
      responses:
        '200':
          description: Successful submission acknowledged by web3forms (JSON success response).
        '422':
          description: Validation failure (missing required fields or honeypot triggered).
components:
  schemas:
    B2BLeadPayload:
      type: object
      required:
        - access_key
        - name
        - email
        - phone
        - message
      properties:
        access_key:
          type: string
          description: web3forms access key (secret). Injected as a hidden field; never commit the real value.
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        company:
          type: string
        role:
          type: string
        services_of_interest:
          type: array
          items:
            type: string
        organizational_challenges:
          type: array
          items:
            type: string
        organization_size:
          type: string
        contact_preference:
          type: string
        message:
          type: string
          description: Free-text message from the lead (required field in the form).
        _honeypot:
          type: string
          description: Visually hidden technical trap field. Must be submitted strictly empty.
